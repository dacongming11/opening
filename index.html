<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胡依荻的小小世界</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh;
    overflow: hidden;
    color: #fff;
  }

  .page {
    width: 100%;
    height: 100vh;
    position: absolute;
    top: 0;
    left: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease, transform 0.8s ease;
    opacity: 0;
    transform: scale(1.02);
  }

  .page.active {
    display: flex;
    opacity: 1;
    transform: scale(1);
    z-index: 1;
  }

  .bg-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -3;
  }

  .bg-mask {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
  }

  .bg-deco {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }

  /* ========== 页面一：可爱雨天森林入口 ========== */
  #page1 .bg-layer {
    background: linear-gradient(180deg, 
      #fff0f5 0%, 
      #fff5e6 30%, 
      #e6f7ff 65%, 
      #f0e6ff 100%);
  }

  #page1 .bg-mask {
    background: linear-gradient(180deg, 
      rgba(255,255,255,0.05) 0%, 
      rgba(180, 160, 200, 0.15) 100%);
    backdrop-filter: blur(1px);
  }

  /* 卡通云朵 清晰质感 */
  .cloud {
    position: absolute;
    font-size: 70px;
    opacity: 0.95;
    animation: cloudFloat 20s linear infinite;
  }
  .cloud.c1 { top: 8%; left: -10%; animation-duration: 26s; }
  .cloud.c2 { top: 18%; left: -10%; animation-duration: 32s; animation-delay: -12s; font-size: 90px; }
  .cloud.c3 { top: 5%; left: -10%; animation-duration: 38s; animation-delay: -22s; font-size: 55px; }

  @keyframes cloudFloat {
    0% { transform: translateX(0); }
    100% { transform: translateX(120vw); }
  }

  /* 清晰可见的雨滴动画 带描边发光质感 */
  .rain-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 1;
    pointer-events: none;
  }

  .raindrop {
    position: absolute;
    background: #ffffff;
    box-shadow: 
      0 0 2px rgba(100, 170, 255, 0.9),
      0 0 4px rgba(150, 200, 255, 0.6),
      0 0 6px rgba(255, 255, 255, 0.4);
    border-radius: 2px;
    animation: rainFall linear infinite;
  }

  @keyframes rainFall {
    0% { transform: translateY(-120px); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translateY(105vh); opacity: 0.3; }
  }

  /* 右下角一排小动物 跳动省略号效果 */
  .animal-row {
    position: absolute;
    right: 8%;
    bottom: 8%;
    display: flex;
    gap: 12px;
    z-index: 2;
  }

  .animal-dot {
    font-size: 32px;
    animation: animalDotBounce 1.4s ease-in-out infinite;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.15));
  }

  .animal-dot:nth-child(1) { animation-delay: 0s; }
  .animal-dot:nth-child(2) { animation-delay: 0.15s; }
  .animal-dot:nth-child(3) { animation-delay: 0.3s; }
  .animal-dot:nth-child(4) { animation-delay: 0.45s; }
  .animal-dot:nth-child(5) { animation-delay: 0.6s; }
  .animal-dot:nth-child(6) { animation-delay: 0.75s; }

  @keyframes animalDotBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* 踩水小男孩 可点击按钮 */
  .rain-boy {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    animation: boyJump 0.8s ease-in-out infinite alternate;
    cursor: pointer;
    transition: transform 0.3s ease;
    user-select: none;
  }

  .rain-boy:hover {
    transform: translateX(-50%) scale(1.12);
    animation-play-state: paused;
  }

  .rain-boy .boy-body {
    font-size: 85px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
  }

  .rain-boy .splash {
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    opacity: 0.7;
    animation: splash 0.8s ease-in-out infinite alternate;
  }

  @keyframes boyJump {
    0% { transform: translateX(-50%) translateY(0); }
    100% { transform: translateX(-50%) translateY(-18px); }
  }

  @keyframes splash {
    0% { opacity: 0.4; transform: translateX(-50%) scale(0.8); }
    100% { opacity: 0.9; transform: translateX(-50%) scale(1.3); }
  }

  .welcome-content {
    text-align: center;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding-bottom: 28vh;
  }

  .welcome-title {
    font-size: 52px;
    font-weight: 800;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #ff8fab, #ffc3a0, #ffd93d, #6bcb77);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: float 3s ease-in-out infinite;
  }

  .welcome-sub {
    font-size: 24px;
    margin-bottom: 10px;
    color: #6b5b73;
    text-shadow: 0 2px 8px rgba(255,255,255,0.7);
  }

  .welcome-tip {
    font-size: 16px;
    color: #7d6d85;
    margin-bottom: 34px;
    text-shadow: 0 2px 6px rgba(255,255,255,0.6);
  }

  /* 正中大门按钮 */
  .door-wrapper {
    position: relative;
    z-index: 2;
  }

  .door-btn {
    width: 200px;
    height: 280px;
    background: linear-gradient(180deg, #ffd89b, #f5a623, #e8941c);
    border: 6px solid #8b5a2b;
    border-radius: 28px 28px 0 0;
    box-shadow:
      0 10px 30px rgba(139, 90, 43, 0.3),
      inset 0 -10px 25px rgba(0, 0, 0, 0.2);
    cursor: pointer;
    transition: all 0.4s ease;
    position: relative;
  }

  .door-handle {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 55px;
    background: linear-gradient(180deg, #ffd700, #cc8800);
    border-radius: 8px;
    box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8);
  }

  .door-btn:hover {
    transform: scale(1.08) translateY(-4px);
    box-shadow:
      0 15px 40px rgba(139, 90, 43, 0.4),
      inset 0 -10px 25px rgba(0, 0, 0, 0.2);
  }

  .door-btn:active {
    transform: scale(1.03);
  }

  .door-flash {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255,255,255,0.98) 0%, rgba(255,223,186,0.9) 35%, transparent 70%);
    opacity: 0;
    z-index: 999;
    pointer-events: none;
    transform: scale(0.5);
  }

  .door-flash.active {
    animation: doorOpenFlash 1s ease-out forwards;
  }

  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 600;
  }

  .btn-primary {
    background: linear-gradient(90deg, #ff8fab, #ffd93d);
    color: #5a3e2b;
    box-shadow: 0 8px 25px rgba(255, 143, 171, 0.4);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(255, 143, 171, 0.5);
  }

  .btn-ghost {
    background: rgba(255,255,255,0.7);
    border: 2px solid #b8a0d0;
    color: #6b5b73;
  }

  .btn-ghost:hover {
    background: rgba(255,255,255,0.9);
  }

  /* 通用弹窗 */
  .modal-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 998;
  }

  .modal-mask.show {
    display: flex;
  }

  .modal {
    background: #fffaf2;
    color: #5a3e2b;
    padding: 40px 50px;
    border-radius: 24px;
    text-align: center;
    animation: popIn 0.35s ease;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    min-width: 300px;
  }

  .modal-emoji {
    font-size: 64px;
    margin-bottom: 16px;
  }

  .modal-text {
    font-size: 18px;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  /* ========== 页面二：奥特曼打小怪兽 ========== */
  #page2 .bg-layer {
    background: linear-gradient(180deg, 
      #0f0c29 0%, 
      #302b63 40%, 
      #24243e 100%);
  }

  #page2 .bg-deco::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 25%;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.4));
  }

  /* 城市剪影 */
  .city-silhouette {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 18%;
    background: #0a0a1a;
    clip-path: polygon(
      0% 100%, 0% 60%, 5% 60%, 5% 40%, 10% 40%, 10% 55%, 
      15% 55%, 15% 30%, 20% 30%, 20% 50%, 25% 50%, 25% 35%,
      30% 35%, 30% 60%, 35% 60%, 35% 25%, 40% 25%, 40% 45%,
      45% 45%, 45% 55%, 50% 55%, 50% 20%, 55% 20%, 55% 50%,
      60% 50%, 60% 35%, 65% 35%, 65% 55%, 70% 55%, 70% 28%,
      75% 28%, 75% 48%, 80% 48%, 80% 38%, 85% 38%, 85% 58%,
      90% 58%, 90% 42%, 95% 42%, 95% 55%, 100% 55%, 100% 100%
    );
    z-index: 1;
  }

  /* 星星点缀 */
  .star {
    position: absolute;
    color: #fff;
    animation: twinkle 2.5s ease-in-out infinite;
  }
  .star.s1 { top: 12%; left: 15%; font-size: 18px; animation-delay: 0s; }
  .star.s2 { top: 20%; left: 40%; font-size: 14px; animation-delay: 0.6s; }
  .star.s3 { top: 8%; left: 70%; font-size: 20px; animation-delay: 1.2s; }
  .star.s4 { top: 25%; left: 85%; font-size: 16px; animation-delay: 1.8s; }
  .star.s5 { top: 15%; left: 55%; font-size: 12px; animation-delay: 0.9s; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* 奥特曼和小怪兽 */
  .fighter-left {
    position: absolute;
    left: 8%;
    bottom: 20%;
    font-size: 130px;
    z-index: 2;
    animation: ultramanAttack 2s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 25px rgba(100, 200, 255, 0.7));
  }

  .fighter-right {
    position: absolute;
    right: 8%;
    bottom: 20%;
    font-size: 120px;
    z-index: 2;
    animation: monsterShake 1.5s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 20px rgba(255, 100, 100, 0.6));
  }

  /* 战斗光线 */
  .fight-beam {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translateX(-50%);
    width: 60%;
    height: 4px;
    background: linear-gradient(90deg, 
      transparent, 
      rgba(100, 200, 255, 0.8), 
      rgba(255, 255, 255, 1), 
      rgba(255, 100, 100, 0.8), 
      transparent);
    z-index: 1;
    animation: beamPulse 1.2s ease-in-out infinite;
    opacity: 0.7;
  }

  @keyframes beamPulse {
    0%, 100% { opacity: 0.3; transform: translateX(-50%) scaleX(0.8); }
    50% { opacity: 0.9; transform: translateX(-50%) scaleX(1.1); }
  }

  @keyframes ultramanAttack {
    0% { transform: translateX(0) rotate(-5deg); }
    100% { transform: translateX(25px) rotate(5deg); }
  }

  @keyframes monsterShake {
    0% { transform: translateX(0) scale(1); }
    100% { transform: translateX(-20px) scale(0.94); }
  }

  .page2-header {
    text-align: center;
    margin-bottom: 40px;
    z-index: 3;
  }

  .page2-title {
    font-size: 36px;
    margin-bottom: 8px;
    color: #fffaf2;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
  }

  .page2-sub {
    font-size: 16px;
    color: rgba(255, 255, 255, 0.8);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  .room-container {
    display: flex;
    gap: 50px;
    width: 100%;
    max-width: 900px;
    justify-content: center;
    align-items: stretch;
    z-index: 3;
  }

  .door-card {
    flex: 1;
    min-width: 300px;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 26px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.4s ease;
    backdrop-filter: blur(14px);
  }

  .door-card:hover {
    transform: translateY(-12px) scale(1.04);
    box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
  }

  .door-visual {
    height: 200px;
    background-size: cover;
    background-position: center;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 70px;
  }

  .door-visual::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.35) 100%);
  }

  .door-sign {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.96);
    color: #6b3fa0;
    padding: 12px 24px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 18px;
    z-index: 2;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
  }

  .door-content {
    padding: 26px;
    text-align: center;
  }

  .door-content h3 {
    font-size: 26px;
    margin-bottom: 10px;
    color: #fffaf2;
  }

  .door-content p {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.7;
  }

  .back-btn {
    position: absolute;
    top: 30px;
    left: 30px;
    padding: 10px 24px;
    background: rgba(255, 255, 255, 0.18);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 30px;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s;
    z-index: 4;
  }

  .back-btn:hover {
    background: rgba(255, 255, 255, 0.28);
  }

  /* ========== 页面三：详情展示页 ========== */
  #page3 {
    justify-content: flex-start;
    overflow-y: auto;
    padding: 80px 40px 60px;
  }

  #page3 .bg-layer {
    transition: background 0.6s ease;
  }

  .world-title {
    font-size: 36px;
    margin-bottom: 10px;
    text-align: center;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    z-index: 2;
  }

  .world-desc {
    font-size: 16px;
    opacity: 0.85;
    margin-bottom: 40px;
    text-align: center;
    z-index: 2;
  }

  .display-stage {
    width: 100%;
    max-width: 1200px;
    background: rgba(255, 255, 255, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 26px;
    padding: 30px;
    backdrop-filter: blur(12px);
    z-index: 2;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  }

  .car-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 25px;
  }

  .car-card {
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 18px;
    overflow: hidden;
    transition: all 0.35s;
  }

  .car-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
  }

  .car-img {
    width: 100%;
    height: 180px;
    background: rgba(255, 255, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
  }

  .car-info {
    padding: 18px;
  }

  .car-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .car-quote {
    font-size: 13px;
    line-height: 1.6;
    opacity: 0.85;
    font-style: italic;
  }

  /* 车车总动员主题 */
  .theme-hotwheel .bg-layer {
    background: linear-gradient(180deg, 
      #ffeaa7 0%, 
      #fdcb6e 30%, 
      #e17055 70%, 
      #d63031 100%);
  }

  .theme-hotwheel {
    color: #5d4037;
  }

  /* 赛道装饰线 */
  .theme-hotwheel .bg-deco::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 15%;
    background: #2d3436;
  }
  .theme-hotwheel .bg-deco::after {
    content: "";
    position: absolute;
    bottom: 7%;
    left: 0;
    width: 100%;
    height: 4px;
    background: repeating-linear-gradient(
      90deg,
      #ffeaa7 0px,
      #ffeaa7 30px,
      transparent 30px,
      transparent 60px
    );
  }

  /* 底部行驶小车 水平翻转 从右往左 */
  .running-car {
    position: absolute;
    bottom: 5%;
    left: 110%;
    font-size: 65px;
    z-index: 2;
    animation: carRun 7s linear infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
  }

  @keyframes carRun {
    0% { left: 110%; }
    100% { left: -10%; }
  }

  /* 盲合拆拆乐主题 */
  .theme-blindbox .bg-layer {
    background: linear-gradient(180deg, 
      #fd79a8 0%, 
      #a29bfe 40%, 
      #74b9ff 80%,
      #81ecec 100%);
  }

  .theme-blindbox {
    color: #4a148c;
  }

  /* 漂浮礼物装饰 */
  .float-gift {
    position: absolute;
    font-size: 35px;
    opacity: 0.6;
    animation: giftFloat 4s ease-in-out infinite;
  }
  .float-gift.g1 { top: 15%; left: 8%; animation-delay: 0s; }
  .float-gift.g2 { top: 25%; right: 10%; animation-delay: 1s; }
  .float-gift.g3 { top: 45%; left: 5%; animation-delay: 2s; }
  .float-gift.g4 { bottom: 20%; left: 12%; animation-delay: 1.5s; }

  @keyframes giftFloat {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
  }

  /* 右下角盲盒打开动画 */
  .opening-box {
    position: absolute;
    bottom: 8%;
    right: 8%;
    font-size: 80px;
    z-index: 2;
    animation: boxOpen 3s ease-in-out infinite;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2));
  }

  .box-sparkle {
    position: absolute;
    bottom: 18%;
    right: 10%;
    font-size: 35px;
    z-index: 2;
    opacity: 0;
    animation: sparkle 3s ease-in-out infinite;
  }

  @keyframes boxOpen {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.25) rotate(-6deg); }
  }

  @keyframes sparkle {
    0%, 40%, 100% { opacity: 0; transform: scale(0.5); }
    60% { opacity: 1; transform: scale(1.4); }
  }

  /* ========== 通用动画 ========== */
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }

  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @keyframes doorOpenFlash {
    0% {
      opacity: 0;
      transform: scale(0.6);
    }
    30% {
      opacity: 1;
      transform: scale(1.15);
    }
    100% {
      opacity: 0;
      transform: scale(1.8);
    }
  }

  ::-webkit-scrollbar {
    width: 8px;
  }

  ::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.1);
  }

  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.35);
    border-radius: 4px;
  }

  @media (max-width: 768px) {
    .welcome-title {
      font-size: 36px;
    }

    .door-btn {
      width: 160px;
      height: 240px;
    }

    .fighter-left, .fighter-right {
      font-size: 80px;
      bottom: 18%;
    }

    .room-container {
      flex-direction: column;
      align-items: center;
    }

    .door-card {
      width: 100%;
      max-width: 360px;
    }

    .car-grid {
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    }

    .animal-dot {
      font-size: 26px;
    }
  }
</style>
</head>
<body>

<!-- 页面一：可爱雨天森林入口 -->
<div id="page1" class="page active">
  <div class="bg-layer"></div>
  <div class="bg-mask"></div>
  <div class="bg-deco">
    <div class="cloud c1">☁️</div>
    <div class="cloud c2">☁️</div>
    <div class="cloud c3">☁️</div>
  </div>

  <!-- 雨滴容器 -->
  <div class="rain-container" id="rainContainer"></div>

  <!-- 右下角一排跳动小动物 -->
  <div class="animal-row">
    <div class="animal-dot">🐱</div>
    <div class="animal-dot">🐶</div>
    <div class="animal-dot">🐤</div>
    <div class="animal-dot">🦆</div>
    <div class="animal-dot">🐰</div>
    <div class="animal-dot">🐻</div>
  </div>

  <!-- 踩水小男孩按钮 -->
  <div class="rain-boy" onclick="showKnockModal()">
    <div class="boy-body">🧒</div>
    <div class="splash">💧</div>
  </div>

  <div class="welcome-content">
    <div class="welcome-title">准备好了吗？</div>
    <div class="welcome-sub">即将进入胡依荻的小小世界 ✨</div>
    <div class="welcome-tip">下雨天的森林里，小车们在小木屋等你一起玩</div>

    <div class="door-wrapper">
      <div class="door-btn" onclick="openDoorAndEnter()">
        <div class="door-handle"></div>
      </div>
    </div>
  </div>
</div>

<!-- 大门闪光动画 -->
<div class="door-flash" id="doorFlash"></div>

<!-- 敲门提示弹窗 -->
<div class="modal-mask" id="knockModal">
  <div class="modal">
    <div class="modal-emoji">😤</div>
    <div class="modal-text">什么！你咋还不敲门呢？</div>
    <button class="btn btn-ghost" onclick="closeKnockAndShowMiss()">先不进去</button>
  </div>
</div>

<!-- 错失一个亿弹窗 -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-emoji">😔</div>
    <div class="modal-text">好吧，你错失了一个亿</div>
    <button class="btn btn-primary" onclick="closeModal()">我再想想</button>
  </div>
</div>

<!-- 页面二：奥特曼打小怪兽 -->
<div id="page2" class="page">
  <div class="bg-layer"></div>
  <div class="bg-mask"></div>
  <div class="bg-deco">
    <div class="star s1">✨</div>
    <div class="star s2">⭐</div>
    <div class="star s3">✨</div>
    <div class="star s4">⭐</div>
    <div class="star s5">✨</div>
    <div class="city-silhouette"></div>
  </div>

  <div class="fight-beam"></div>
  <div class="fighter-left">🦸</div>
  <div class="fighter-right">👾</div>

  <button class="back-btn" onclick="goPage(1)">← 返回入口</button>

  <div class="page2-header">
    <div class="page2-title">超能量车库大厅</div>
    <div class="page2-sub">两扇神秘大门，一边是速度，一边是惊喜</div>
  </div>

  <div class="room-container">
    <div class="door-card" onclick="enterWorld('hotwheel')">
      <div class="door-visual" style="background: linear-gradient(135deg, #ff9966, #ff5e62);">
        <div class="door-sign">车车总动员</div>
        🏎️
      </div>
      <div class="door-content">
        <h3>🔥 车车总动员</h3>
        <p>风火轮、多美卡、各路神车集结<br>速度与激情的专属赛道</p>
      </div>
    </div>

    <div class="door-card" onclick="enterWorld('blindbox')">
      <div class="door-visual" style="background: linear-gradient(135deg, #a18cd1, #fbc2eb);">
        <div class="door-sign">盲合拆拆乐</div>
        🎁
      </div>
      <div class="door-content">
        <h3>🎁 盲合拆拆乐</h3>
        <p>限定款、隐藏款、奇奇怪怪小可爱<br>每一盒都是未知的惊喜</p>
      </div>
    </div>
  </div>
</div>

<!-- 页面三：详情展示页 -->
<div id="page3" class="page">
  <div class="bg-layer"></div>
  <div class="bg-mask"></div>
  <div class="bg-deco" id="page3Deco"></div>

  <!-- 车车总动员专属动画元素 -->
  <div class="running-car" id="runningCar" style="display:none;">🏎️</div>

  <!-- 盲盒专属动画元素 -->
  <div class="opening-box" id="openingBox" style="display:none;">🎁</div>
  <div class="box-sparkle" id="boxSparkle" style="display:none;">✨</div>

  <button class="back-btn" onclick="goPage(2)">← 返回大厅</button>

  <div class="world-title" id="worldTitle"></div>
  <div class="world-desc" id="worldDesc"></div>

  <div class="display-stage">
    <div class="car-grid" id="carGrid"></div>
  </div>
</div>

<script>
  // 生成清晰版雨滴
  function createRaindrops() {
    const container = document.getElementById('rainContainer');
    const count = 130;
    for (let i = 0; i < count; i++) {
      const drop = document.createElement('div');
      drop.className = 'raindrop';
      drop.style.left = Math.random() * 100 + '%';
      // 随机大小，模拟远近层次
      const width = 1.5 + Math.random() * 2;
      const height = 14 + Math.random() * 20;
      drop.style.width = width + 'px';
      drop.style.height = height + 'px';
      drop.style.animationDuration = (0.4 + Math.random() * 0.9) + 's';
      drop.style.animationDelay = Math.random() * 2.5 + 's';
      drop.style.opacity = 0.4 + Math.random() * 0.5;
      container.appendChild(drop);
    }
  }
  createRaindrops();

  // 页面跳转
  function goPage(num) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page' + num).classList.add('active');
  }

  // 大门打开闪光并进入第二页
  function openDoorAndEnter() {
    const flash = document.getElementById('doorFlash');
    flash.classList.add('active');

    setTimeout(() => {
      flash.classList.remove('active');
      goPage(2);
    }, 1000);
  }

  // 敲门提示弹窗
  function showKnockModal() {
    document.getElementById('knockModal').classList.add('show');
  }

  function closeKnockModal() {
    document.getElementById('knockModal').classList.remove('show');
  }

  // 关闭敲门弹窗并显示错失一个亿
  function closeKnockAndShowMiss() {
    closeKnockModal();
    setTimeout(() => {
      showModal();
    }, 200);
  }

  // 错失一个亿弹窗
  function showModal() {
    document.getElementById('modal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  // 小车数据
  const carData = {
    hotwheel: {
      title: '🔥 车车总动员',
      desc: '每一辆小车都带着风的味道，在展示台上排好队等你检阅。',
      theme: 'theme-hotwheel',
      cars: [
        { emoji: '🏎️', name: '雪佛兰科迈罗', quote: '我是赛道上的橙色闪电，没人能追上我的尾焰。' },
        { emoji: '🚗', name: '福特野马', quote: '美式肌肉的咆哮，是我最动听的告白。' },
        { emoji: '🚓', name: '保时捷911警车版', quote: '圆润的屁股下，藏着一颗暴躁的心。' },
        { emoji: '🚙', name: '吉普牧马人', quote: '越野是我的宿命，泥巴是我的勋章。' },
        { emoji: '🚕', name: '兰博基尼出租车', quote: '棱角即是正义，帅就一个字。' },
        { emoji: '🚘', name: '日产GTR', quote: '东瀛战神在此，弯道请多指教。' }
      ]
    },
    blindbox: {
      title: '🎁 盲合拆拆乐',
      desc: '这里没有规则，只有惊喜。每一辆小可爱都带着一点调皮和一点神秘。',
      theme: 'theme-blindbox',
      cars: [
        { emoji: '🍔', name: '麦当劳送餐车', quote: '薯条可乐已就位，请问几号餐？' },
        { emoji: '🎀', name: 'Hello Kitty 小车', quote: '粉粉嫩嫩，谁还不是个小可爱呢。' },
        { emoji: '🦖', name: '侏罗纪公园越野车', quote: '快跑！霸王龙在后面追着呢！' },
        { emoji: '🚀', name: '星球大战X翼战机', quote: '原力与你我同在，啾——' },
        { emoji: '🎢', name: '哆啦A梦时光机', quote: '坐好了，我们要穿越时空啦！' },
        { emoji: '🍌', name: '马里奥卡丁车', quote: '香蕉皮警告！第一名我收下了。' }
      ]
    }
  };

  // 生成盲盒页漂浮礼物
  function createGiftDecorations() {
    const deco = document.getElementById('page3Deco');
    deco.innerHTML = `
      <div class="float-gift g1">🎁</div>
      <div class="float-gift g2">🎀</div>
      <div class="float-gift g3">⭐</div>
      <div class="float-gift g4">💝</div>
    `;
  }

  // 进入对应小世界
  function enterWorld(key) {
    const data = carData[key];
    const page3 = document.getElementById('page3');
    const runningCar = document.getElementById('runningCar');
    const openingBox = document.getElementById('openingBox');
    const boxSparkle = document.getElementById('boxSparkle');
    const deco = document.getElementById('page3Deco');

    // 切换主题类名
    page3.className = 'page ' + data.theme;

    // 控制动画元素显示
    runningCar.style.display = 'none';
    openingBox.style.display = 'none';
    boxSparkle.style.display = 'none';
    deco.innerHTML = '';

    if (key === 'hotwheel') {
      runningCar.style.display = 'block';
    } else if (key === 'blindbox') {
      openingBox.style.display = 'block';
      boxSparkle.style.display = 'block';
      createGiftDecorations();
    }

    // 填充标题
    document.getElementById('worldTitle').textContent = data.title;
    document.getElementById('worldDesc').textContent = data.desc;

    // 生成小车卡片
    const grid = document.getElementById('carGrid');
    grid.innerHTML = '';

    data.cars.forEach(car => {
      const card = document.createElement('div');
      card.className = 'car-card';
      card.innerHTML = `
        <div class="car-img">${car.emoji}</div>
        <div class="car-info">
          <div class="car-name">${car.name}</div>
          <div class="car-quote">"${car.quote}"</div>
        </div>
      `;
      grid.appendChild(card);
    });

    goPage(3);
  }
</script>

</body>
</html>
