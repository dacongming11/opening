<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胡依荻的小小车世界</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    height: 100vh;
    background: #0f0f1e;
    color: #fff;
  }

  /* 页面容器 */
  .page {
    width: 100%;
    height: 100vh;
    position: absolute;
    top: 0;
    left: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }
  .page.active { display: flex; opacity: 1; }

  /* ========== 页面一：欢迎页 ========== */
  #page1 {
    background: linear-gradient(135deg, #1a1a3e 0%, #2d1b69 50%, #ff6b9d 100%);
  }
  .welcome-title {
    font-size: 42px;
    font-weight: 700;
    margin-bottom: 20px;
    text-align: center;
    background: linear-gradient(90deg, #fff, #ffd89b);
    /* 补充标准属性，消除VS Code警告 */
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: float 3s ease-in-out infinite;
  }
  .welcome-sub {
    font-size: 20px;
    margin-bottom: 50px;
    opacity: 0.85;
  }
  .btn-group { display: flex; gap: 30px; }
  .btn {
    padding: 14px 40px;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 600;
  }
  .btn-primary {
    background: linear-gradient(90deg, #ff6b9d, #ffd89b);
    color: #2d1b69;
    box-shadow: 0 8px 25px rgba(255, 107, 157, 0.4);
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255, 107, 157, 0.5); }
  .btn-ghost {
    background: transparent;
    border: 2px solid rgba(255,255,255,0.5);
    color: #fff;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.1); }

  /* 弹窗 */
  .modal-mask {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff;
    color: #333;
    padding: 40px 50px;
    border-radius: 20px;
    text-align: center;
    animation: popIn 0.3s ease;
  }
  .modal-emoji { font-size: 60px; margin-bottom: 15px; }
  .modal-text { font-size: 18px; margin-bottom: 20px; }

  /* ========== 页面二：分类页 ========== */
  #page2 {
    background: linear-gradient(160deg, #0f0c29, #302b63, #24243e);
    padding: 60px 40px;
    justify-content: flex-start;
    overflow-y: auto;
  }
  .page2-title {
    font-size: 32px;
    margin-bottom: 10px;
    margin-top: 20px;
  }
  .page2-sub {
    opacity: 0.7;
    margin-bottom: 50px;
  }
  .category-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 30px;
    width: 100%;
    max-width: 1100px;
  }
  .category-card {
    height: 280px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
  }
  .category-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  }
  .category-card h3 {
    font-size: 24px;
    margin-bottom: 8px;
    z-index: 2;
  }
  .category-card p {
    font-size: 14px;
    opacity: 0.85;
    z-index: 2;
  }
  .cat-hotwheel { background: linear-gradient(135deg, #ff512f, #dd2476); }
  .cat-tomica { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #0a2540; }
  .cat-tarmac { background: linear-gradient(135deg, #134e5e, #71b280); }
  .cat-mystery { background: linear-gradient(135deg, #8a2be2, #ff69b4, #ffd700); }

  .back-btn {
    position: absolute;
    top: 30px;
    left: 30px;
    padding: 10px 24px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 30px;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.3s;
  }
  .back-btn:hover { background: rgba(255,255,255,0.25); }

  /* ========== 页面三：详情展示页 ========== */
  #page3 {
    justify-content: flex-start;
    overflow-y: auto;
    padding: 80px 40px 60px;
    height: 100vh;
  }
  .world-title {
    font-size: 36px;
    margin-bottom: 10px;
    text-align: center;
  }
  .world-desc {
    opacity: 0.8;
    margin-bottom: 40px;
    text-align: center;
  }
  .car-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 25px;
    width: 100%;
    max-width: 1200px;
  }
  .car-card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.35s;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .car-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
  }
  .car-img {
    width: 100%;
    height: 180px;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
  }
  .car-info {
    padding: 18px;
  }
  .car-name {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .car-quote {
    font-size: 13px;
    line-height: 1.6;
    opacity: 0.85;
    font-style: italic;
  }

  /* 主题配色 */
  .theme-hotwheel { background: linear-gradient(180deg, #2b0a0a, #7a1f1f, #ff512f); }
  .theme-tomica { background: linear-gradient(180deg, #0a2540, #1e5799, #4facfe); color: #fff; }
  .theme-tarmac { background: linear-gradient(180deg, #0a2020, #134e5e, #71b280); }
  .theme-mystery { background: linear-gradient(180deg, #2a0845, #6441a5, #ff69b4); }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
</style>
</head>
<body>

<!-- 页面一：欢迎页 -->
<div id="page1" class="page active">
  <div class="welcome-title">准备好了吗？</div>
  <div class="welcome-sub">即将进入胡依荻的小小世界 ✨</div>
  <div class="btn-group">
    <button class="btn btn-primary" onclick="goPage(2)">确认进入</button>
    <button class="btn btn-ghost" onclick="showModal()">返回</button>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-emoji">😔</div>
    <div class="modal-text">好吧，你错失了一个亿</div>
    <button class="btn btn-primary" onclick="closeModal()">我再想想</button>
  </div>
</div>

<!-- 页面二：分类页 -->
<div id="page2" class="page">
  <button class="back-btn" onclick="goPage(1)">← 返回</button>
  <div class="page2-title">选择一个小世界</div>
  <div class="page2-sub">每一扇门后，都藏着不一样的风景</div>
  <div class="category-grid">
    <div class="category-card cat-hotwheel" onclick="enterWorld('hotwheel')">
      <h3>🔥 烈焰赛道</h3>
      <p>风火轮专属宇宙 · 速度与激情</p>
    </div>
    <div class="category-card cat-tomica" onclick="enterWorld('tomica')">
      <h3>🏙 迷你城镇</h3>
      <p>多美卡の日系小天地</p>
    </div>
    <div class="category-card cat-tarmac" onclick="enterWorld('tarmac')">
      <h3>🛣 精工柏油路</h3>
      <p>Tarmac Works 精品工坊</p>
    </div>
    <div class="category-card cat-mystery" onclick="enterWorld('mystery')">
      <h3>🎁 奇妙盲盒车库</h3>
      <p>杂七杂八的惊喜收藏</p>
    </div>
  </div>
</div>

<!-- 页面三：详情展示页 -->
<div id="page3" class="page">
  <button class="back-btn" onclick="goPage(2)">← 返回分类</button>
  <div class="world-title" id="worldTitle"></div>
  <div class="world-desc" id="worldDesc"></div>
  <div class="car-grid" id="carGrid"></div>
</div>

<script>
  // 页面跳转
  function goPage(num) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page' + num).classList.add('active');
  }

  // 弹窗控制
  function showModal() {
    document.getElementById('modal').classList.add('show');
  }
  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  // 小车数据
  const carData = {
    hotwheel: {
      title: '🔥 烈焰赛道 · 风火轮宇宙',
      desc: '每一辆都载着童年的风，在橙色轨道上飞驰不停',
      theme: 'theme-hotwheel',
      cars: [
        { emoji: '🏎️', name: '雪佛兰科迈罗', quote: '我是赛道上的橙色闪电，没人能追上我的尾焰。' },
        { emoji: '🚗', name: '福特野马', quote: '美式肌肉的咆哮，是我最动听的告白。' },
        { emoji: '🏁', name: '保时捷911', quote: '圆润的屁股下，藏着一颗暴躁的心。' },
        { emoji: '🚙', name: '吉普牧马人', quote: '越野是我的宿命，泥巴是我的勋章。' },
        { emoji: '🏎️', name: '兰博基尼毒药', quote: '棱角即是正义，帅就一个字。' },
        { emoji: '🚘', name: '日产GTR', quote: '东瀛战神在此，弯道请多指教。' },
      ]
    },
    tomica: {
      title: '🏙 迷你城镇 · 多美卡天地',
      desc: '精致小巧的日系伙伴，安静地守护着这座小城',
      theme: 'theme-tomica',
      cars: [
        { emoji: '🚓', name: '丰田皇冠警车', quote: '城市秩序由我守护，嘀呜嘀呜——' },
        { emoji: '🚕', name: '丰田出租车', quote: '去哪里呀乘客？我可是东京老司机。' },
        { emoji: '🚑', name: '日产救护车', quote: '生命通道畅通无阻，使命必达。' },
        { emoji: '🚒', name: '森田消防车', quote: '有火灾的地方，就有我红色的身影。' },
        { emoji: '🚐', name: '本田小货车', quote: '拉货搬家样样行，日本国民好帮手。' },
        { emoji: '🏯', name: '新干线E5', quote: '虽然我不是车，但我跑得比谁都快。' },
      ]
    },
    tarmac: {
      title: '🛣 精工柏油路 · Tarmac Works',
      desc: '每一处细节都值得推敲，精品收藏的终极归宿',
      theme: 'theme-tarmac',
      cars: [
        { emoji: '🏆', name: '保时捷993 GT2', quote: '风冷之王的传说，由我续写。' },
        { emoji: '🎌', name: '三菱EVO IX', quote: '拉力赛场的传奇，4G63永不灭。' },
        { emoji: '🌃', name: '日产Silvia S15', quote: '漂移是我的艺术，尾灯是我的画笔。' },
        { emoji: '⚡', name: '本田NSX', quote: '东瀛法拉利，可不是随便叫的。' },
        { emoji: '🏁', name: '宝马M3 E30', quote: '方盒子的经典，操控的天花板。' },
        { emoji: '🔥', name: '马自达RX-7', quote: '转子之心，尖叫到红区才够味。' },
      ]
    },
    mystery: {
      title: '🎁 奇妙盲盒车库',
      desc: '乱七八糟却又爱不释手，每一辆都是意外之喜',
      theme: 'theme-mystery',
      cars: [
        { emoji: '🍔', name: '麦当劳送餐车', quote: '薯条可乐已就位，请问几号餐？' },
        { emoji: '🎀', name: 'Hello Kitty 小车', quote: '粉粉嫩嫩，谁还不是个小可爱呢。' },
        { emoji: '🦖', name: '侏罗纪公园越野车', quote: '快跑！霸王龙在后面追着呢！' },
        { emoji: '🚀', name: '星球大战X翼战机', quote: '原力与你我同在，啾——' },
        { emoji: '🎢', name: '哆啦A梦时光机', quote: '坐好了，我们要穿越时空啦！' },
        { emoji: '🍌', name: '马里奥卡丁车', quote: '香蕉皮警告！第一名我收下了。' },
      ]
    }
  };

  // 进入对应小世界
  function enterWorld(key) {
    const data = carData[key];
    const page3 = document.getElementById('page3');
    
    // 切换主题
    page3.className = 'page ' + data.theme;
    
    // 填充标题
    document.getElementById('worldTitle').textContent = data.title;
    document.getElementById('worldDesc').textContent = data.desc;
    
    // 生成小车卡片
    const grid = document.getElementById('carGrid');
    grid.innerHTML = '';
    data.cars.forEach(car => {
      const card = document.createElement('div');
      card.className = 'car-card';
      card.innerHTML = `
        <div class="car-img">${car.emoji}</div>
        <div class="car-info">
          <div class="car-name">${car.name}</div>
          <div class="car-quote">"${car.quote}"</div>
        </div>
      `;
      grid.appendChild(card);
    });
    
    goPage(3);
  }
</script>

</body>
</html>
